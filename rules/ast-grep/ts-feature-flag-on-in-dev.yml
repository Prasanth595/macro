id: ts-feature-flag-on-in-dev
language: typescript
severity: error
message: Default a new flag on in dev — `DEV_MODE_ENV` for an env-only flag, `onInDev` for a remote one.
note: |-
  Rule FE-56 in docs/development/style-guide.md. A flag that is off in dev
  hides a merged feature from everyone testing dev.macro.com, and a local
  VITE_* override hides that from its author. Choosing env-only over PostHog
  doesn't change this. To keep a flag off in dev on purpose, say why on the
  line above: `// ast-grep-ignore: ts-feature-flag-on-in-dev -- <why>`.
files:
  - apps/web/src/lib/core/constant/featureFlags.ts
rule:
  any:
    # `default: false` is off everywhere; on a remote flag it also skips PostHog.
    - kind: pair
      all:
        - has:
            field: key
            regex: ^default$
        - has:
            field: value
            kind: 'false'
      inside:
        kind: object
        inside:
          kind: arguments
          inside:
            kind: call_expression
            has:
              field: function
              regex: ^defineFlag$
    # An env-only flag (no `key`) without a `default` is off everywhere.
    - kind: object
      not:
        has:
          kind: pair
          has:
            field: key
            regex: ^(key|default)$
      inside:
        kind: arguments
        inside:
          kind: call_expression
          has:
            field: function
            regex: ^defineFlag$
  # Flags that were already off in dev when FE-56 landed. Don't add to this
  # list: suppress inline with a reason instead.
  not:
    inside:
      kind: variable_declarator
      stopBy: end
      has:
        field: name
        regex: ^(showDatabaseSql|ENABLE_SCRIPTING|ENABLE_BEARER_TOKEN_AUTH|ENABLE_INBOX_RESYNC|ENABLE_STATIC_DOCUMENT_CARDS|ENABLE_MARKDOWN_AI_GENERATE|ENABLE_CLIENT_EMAIL_SIGNAL_FILTER|ENABLE_PR_DISCUSSION_INPUT|UNIFIED_CHANNEL_INPUT|enableCrmLists)$
