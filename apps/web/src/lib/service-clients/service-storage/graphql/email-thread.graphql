query EmailThreadPage($threadId: ID!, $offset: Int!, $limit: Int!) {
	user {
		id
		emailThread(input: { threadId: $threadId }) {
			...EmailThreadPageFields
			# Read from the device cache only, so bodies are on hand the moment the
			# thread renders and a refresh never prepares them on the server.
			# EmailThreadPreparedBodies fetches them; the version is the client's
			# SERVER_PREPARE_VERSION.
			messages(offset: $offset, limit: $limit) {
				__typename
				id
				preparedBody(version: 1) @fromCache {
					version
					html
					hasTable
					hasHiddenContent
					imageProxyUrl
					sourceLength
				}
			}
		}
	}
}

fragment EmailThreadPageFields on GraphqlSoupEmailThread {
	...SoupItemFields
	__typename
	id
	providerId
	linkId
	inboxVisible
	isRead
	projectId
	latestInboundMessageTs
	createdAt
	updatedAt
	viewerPermission {
		__typename
		... on GraphqlAccessLevelPermission {
			accessLevel
		}
	}
	labels {
		__typename
		id
		linkId
		providerLabelId
		name
		createdAt
		messageListVisibility
		labelListVisibility
		type
	}
	messages(offset: $offset, limit: $limit) {
		...EmailThreadMessageFields
	}
}

fragment EmailThreadMessageFields on GraphqlSoupEmailMessage {
  operationStatus { state revision remoteVersion issue }
	__typename
	id
	providerId
	threadId
	replyingToId
	linkId
	subject
	snippet
	internalDateTs
	sentAt
	isRead
	isStarred
	isSent
	isDraft
	hasAttachments
	scheduledSendTime
	from {
		email
		name
		photoUrl
	}
	to {
		email
		name
		photoUrl
	}
	cc {
		email
		name
		photoUrl
	}
	bcc {
		email
		name
		photoUrl
	}
	labels {
		providerLabelId
		name
	}
	bodyText
	bodyHtmlSanitized
	bodyMacro
	calendarInvitations
	bodyReplyless
	attachments {
		__typename
		id
		providerId
		filename
		mimeType
		sizeBytes
		sfsId
		contentId
		referenceUrl
	}
	attachmentsDraft {
		__typename
		id
		draftId
		fileName
		contentType
		sha
		size
		s3Key
		uploadPending
		contentId
		isInline
	}
	attachmentsForwarded {
		__typename
		attachmentId
		draftId
		providerAttachmentId
		messageProviderId
		filename
		mimeType
		sizeBytes
	}
	createdAt
	updatedAt
}

# Explicit identity read follows durable redirects without requiring a cached page.
fragment EmailThreadIdentityFields on GraphqlSoupEmailThread {
    id
    cacheProjection @cacheOnly
}

# Server-prepared reader HTML for a thread page's messages. Kept out of
# EmailThreadPage so threads cached by backfill, whose records lack it, still
# open from the cache.
query EmailThreadPreparedBodies(
	$threadId: ID!
	$offset: Int!
	$limit: Int!
	$version: Int!
) {
	user {
		id
		emailThread(input: { threadId: $threadId }) {
			__typename
			id
			messages(offset: $offset, limit: $limit) {
				__typename
				id
				preparedBody(version: $version) {
					version
					html
					hasTable
					hasHiddenContent
					imageProxyUrl
					sourceLength
				}
			}
		}
	}
}

# Compact cached Quick Access rows: no snippets or message bodies.
fragment EmailQuickAccessFields on GraphqlSoupEmailThread {
    __typename
    id
    name
    ownerId
    createdAt
    updatedAt
    viewedAt
    senderName
    senderEmail
    senders { name email }
    isRead
    isDraft
    isImportant
    inboxVisible
    linkId
}
