# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/ios_native_check.rs
name: iOS Native Check
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - labeled
    - unlabeled
    branches:
    - main
jobs:
  ios-native-check:
    name: iOS Native Check
    runs-on: namespace-profile-linux-tiny-no-cache
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        fetch-depth: '0'
        persist-credentials: 'false'
    - id: filter
      name: Detect native iOS changes
      uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
      with:
        filters: |
          ios_native:
            - 'apps/web/tauri/**'
    - name: Setup Bun
      if: steps.filter.outputs.ios_native == 'true' && !contains(github.event.pull_request.labels.*.name, 'skip-ios-update')
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: '1.3.13'
    - name: Verify iOS release numbers were bumped
      if: steps.filter.outputs.ios_native == 'true' && !contains(github.event.pull_request.labels.*.name, 'skip-ios-update')
      run: bun scripts/ios-verify-native-bump.mjs
      env:
        BASE_REF: origin/${{ github.base_ref }}
      working-directory: apps/web
    - name: Require the App Store release to be live
      if: steps.filter.outputs.ios_native == 'true' && !contains(github.event.pull_request.labels.*.name, 'skip-ios-update')
      run: bun scripts/ios-app-store.mjs status --require-live
      env:
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      working-directory: apps/web
    - name: Skipped via label
      if: steps.filter.outputs.ios_native == 'true' && contains(github.event.pull_request.labels.*.name, 'skip-ios-update')
      run: echo "Native iOS changes detected, but the skip-ios-update label says they don't break the native/web contract — skipping the App Store release gate."
concurrency:
  group: ios-native-check-${{ github.ref }}
  cancel-in-progress: true
